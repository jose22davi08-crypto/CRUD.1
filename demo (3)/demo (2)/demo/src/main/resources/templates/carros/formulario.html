<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Carro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button, .voltar {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #007bff;
            color: white;
        }

        .voltar {
            background: #6c757d;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${carro != null ? 'Editar Carro' : 'Cadastrar Carro'}">
        Cadastrar Carro
    </h1>

    <!-- CADASTRO -->
    <form th:if="${carro == null}"
          th:action="@{/carros/salvar}"
          method="post">

        <label>Modelo:</label>
        <input type="text"
               name="modelo"
               placeholder="Digite o modelo"
               required
               maxlength="100">

        <label>Marca:</label>
        <input type="text"
               name="marca"
               placeholder="Digite a marca"
               required
               maxlength="100">

        <label>Ano:</label>
        <input type="text"
               name="ano"
               placeholder="Digite o ano"
               required
               maxlength="4">

        <button type="submit">Cadastrar</button>

        <a th:href="@{/carros/index}" class="voltar">
            Voltar
        </a>

    </form>

    <!-- EDIÇÃO -->
    <form th:if="${carro != null}"
          th:action="@{/carros/atualizar/{id}(id=${carro.get('id')})}"
          method="post">

        <label>Modelo:</label>
        <input type="text"
               name="modelo"
               th:value="${carro.get('modelo')}"
               required
               maxlength="100">

        <label>Marca:</label>
        <input type="text"
               name="marca"
               th:value="${carro.get('marca')}"
               required
               maxlength="100">

        <label>Ano:</label>
        <input type="text"
               name="ano"
               th:value="${carro.get('ano')}"
               required
               maxlength="4">

        <button type="submit">Salvar Alterações</button>

        <a th:href="@{/carros/index}" class="voltar">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
