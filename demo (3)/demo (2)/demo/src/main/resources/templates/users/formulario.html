
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Pessoa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button, .voltar {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #007bff;
            color: white;
        }

        .voltar {
            background: #6c757d;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 th:text="${pessoa != null ? 'Editar Pessoa' : 'Cadastrar Pessoa'}">
        Cadastrar Pessoa
    </h1>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form th:if="${pessoa == null}"
          th:action="@{/pessoas/salvar}"
          method="post">

        <label>Nome:</label>
        <input type="text"
               name="nome"
               placeholder="Digite o nome"
               required
               maxlength="100">

        <label>Sobrenome:</label>
        <input type="text"
               name="sobrenome"
               placeholder="Digite o sobrenome"
               required
               maxlength="100">

        <label>E-mail:</label>
        <input type="email"
               name="email"
               placeholder="Digite o e-mail"
               required
               maxlength="100">

        <button type="submit">Cadastrar</button>

        <a th:href="@{/pessoas/index}" class="voltar">
            Voltar
        </a>

    </form>

    <!-- FORMULÁRIO DE EDIÇÃO -->
    <form th:if="${pessoa != null}"
          th:action="@{/pessoas/atualizar/{id}(id=${pessoa.get('id')})}"
          method="post">

        <label>Nome:</label>
        <input type="text"
               name="nome"
               th:value="${pessoa.get('nome')}"
               required
               maxlength="100">

        <label>Sobrenome:</label>
        <input type="text"
               name="sobrenome"
               th:value="${pessoa.get('sobrenome')}"
               required
               maxlength="100">

        <label>E-mail:</label>
        <input type="email"
               name="email"
               th:value="${pessoa.get('email')}"
               required
               maxlength="100">

        <button type="submit">Salvar Alterações</button>

        <a th:href="@{/pessoas/index}" class="voltar">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
