
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 30px;
        }

        h1 {
            color: #333;
        }

        .botao {
            display: inline-block;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .editar {
            background: #ffc107;
            color: black;
        }

        .excluir {
            background: #dc3545;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        form {
            display: inline;
        }
    </style>
</head>

<body>

<h1>Cadastro de Pessoas</h1>

<p>Gerencie as pessoas cadastradas no sistema.</p>

<a th:href="@{/pessoas/novo}" class="botao">
    Cadastrar Nova Pessoa
</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Sobrenome</th>
        <th>E-mail</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="pessoa : ${pessoas}">

        <td th:text="${pessoa.get('id')}"></td>

        <td th:text="${pessoa.get('nome')}"></td>

        <td th:text="${pessoa.get('sobrenome')}"></td>

        <td th:text="${pessoa.get('email')}"></td>

        <td>
            <a th:href="@{/pessoas/editar/{id}(id=${pessoa.get('id')})}"
               class="botao editar">
                Editar
            </a>

            <form th:action="@{/pessoas/excluir/{id}(id=${pessoa.get('id')})}"
                  method="post"
                  onsubmit="return confirm('Tem certeza de que deseja excluir esta pessoa?');">

                <button type="submit" class="botao excluir">
                    Excluir
                </button>

            </form>
        </td>

    </tr>

    <tr th:if="${#lists.isEmpty(pessoas)}">
        <td colspan="5">
            Nenhuma pessoa cadastrada.
        </td>
    </tr>

    </tbody>
</table>

</body>
</html>
